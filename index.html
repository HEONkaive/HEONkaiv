<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>의과대학 문제풀이 플랫폼</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #ecf0f1;
            --sidebar-hover: #34495e;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --btn-bg: #ffffff;
            --btn-hover: #f0f0f0;
            --primary-color: #3498db;
            --right-bg: #f8f9fa;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --sidebar-bg: #1e1e1e;
            --sidebar-text: #e0e0e0;
            --sidebar-hover: #2d2d2d;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --btn-bg: #2d2d2d;
            --btn-hover: #3d3d3d;
            --primary-color: #2980b9;
            --right-bg: #181818;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; transition: background 0.3s, color 0.3s; }
        body { display: flex; height: 100vh; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }

        /* 사이드바 스타일 */
        sidebar { width: 280px; background-color: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
        .sidebar-header { padding: 20px; font-size: 1.2em; font-weight: bold; border-bottom: 1px solid var(--sidebar-hover); display: flex; justify-content: space-between; align-items: center; }
        .menu-list { flex: 1; overflow-y: auto; padding: 15px; }
        .subject-item { margin-bottom: 10px; }
        .subject-btn { width: 100%; padding: 12px 15px; text-align: left; background: none; border: none; color: var(--sidebar-text); font-size: 1em; cursor: pointer; border-radius: 6px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .subject-btn:hover { background-color: var(--sidebar-hover); }
        .professor-list { padding-left: 15px; margin-top: 5px; display: none; }
        .professor-list.active { display: block; }
        .prof-btn { width: 100%; padding: 8px 12px; text-align: left; background: none; border: none; color: var(--sidebar-text); opacity: 0.8; font-size: 0.95em; cursor: pointer; border-radius: 4px; margin: 3px 0; }
        .prof-btn:hover { opacity: 1; background-color: var(--sidebar-hover); }

        /* 테마 토글 버튼 */
