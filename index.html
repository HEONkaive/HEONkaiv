<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HEON archive - 의대생 아카이브</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-bg: #161b22;
            --sidebar-text: #c9d1d9;
            --sidebar-hover: #21262d;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #30363d;
            --primary-color: #58a6ff;
            --right-bg: #0d1117;
            --badge-green: #238636;
            --badge-orange: #d18616;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #ecf0f1;
            --sidebar-hover: #34495e;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --btn-bg: #ffffff;
            --btn-hover: #f0f0f0;
            --primary-color: #3498db;
            --right-bg: #f8f9fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; transition: background 0.3s, color 0.3s; }
        body { display: flex; height: 100vh; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }

        /* 사이드바 스타일 */
        sidebar { width: 280px; background-color: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
        .sidebar-header { padding: 25px 20px; font-size: 1.2em; font-weight: bold; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .menu-list { flex: 1; overflow-y: auto; padding: 15px; }
        .subject-item { margin-bottom: 8px; }
        .subject-btn { width: 100%; padding: 14px 15px; text-align: left; background: none; border: none; color: var(--sidebar-text); font-size: 1em; cursor: pointer; border-radius: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .subject-btn:hover { background-color: var(--sidebar-hover); color: var(--primary-color); }
        .subject-btn.active { background-color: var(--sidebar-hover); border-left: 4px solid var(--primary-color); color: var(--primary-color); }

        /* 상단 탑바 */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .topbar { padding: 15px 30px; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .topbar-title { font-size: 1.3em; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .topbar-controls { display: flex; gap: 15px; align-items: center; }
        .control-btn { padding: 8px 16px; background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px; cursor: pointer; font-weight: bold; }
        .control-btn:hover { background: var(--btn-hover); }
        .control-btn.danger { background-color: #da3633; color: white; border: none; }

        /* 콘텐츠 뷰 영역 */
        .content-area { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 25px; }
        
        .notice-banner { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .badge-update { background-color: var(--badge-green); color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.85em; font-weight: bold; width: fit-content; }

        .dashboard-section { display: flex; flex-direction: column; gap: 20px; }
        .section-title { font-size: 1.4em; font-weight: bold; color: var(--primary-color); border-left: 4px solid var(--primary-color); padding-left: 10px; }
        
        .prof-dashboard-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .prof-name { font-size: 1.2em; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        .exam-buttons-grid { display: flex; flex-wrap: wrap; gap: 12px; }
        .exam-btn { padding: 12px 20px; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; display: flex; align-items: center; gap: 6px; }
        .exam-btn.completed { background-color: var(--badge-green); } /* 초록색 체크 */
        .exam-btn.in-progress { background-color: var(--badge-orange); } /* 주황색 진행중 */
        .exam-btn.not-started { background-color: var(--btn-bg); color: var(--text-color); border: 1px solid var(--border-color); }
        .exam-btn:hover { opacity: 0.9; }

        /* 문제 풀이 뷰 (2분할 레이아웃) */
        .quiz-container { display: flex; flex: 1; height: calc(100vh - 75px); overflow: hidden; }
        .quiz-left { flex: 1; border-right: 1px solid var(--border-color); overflow-y: auto; padding: 30px; background: var(--card-bg); display: flex; flex-direction: column; gap: 20px; }
        .quiz-right { flex: 1; overflow-y: auto; padding: 30px; background: var(--right-bg); display: flex; flex-direction: column; gap: 20px; }

        .quiz-toolbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .score-board { font-size: 1em; font-weight: bold; color: var(--primary-color); }
        .q-select { padding: 6px 12px; background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 4px; font-weight: bold; }

        .question-box { font-size: 1.15em; font-weight: bold; line-height: 1.6; }
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { width: 100%; padding: 14px 18px; text-align: left; background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; cursor: pointer; font-size: 1em; }
        .option-btn:hover { background: var(--btn-hover); border-color: var(--primary-color); }
        .option-btn.correct { background-color: #238636 !important; color: white !important; border-color: #238636; }
        .option-btn.wrong { background-color: #da3633 !important; color: white !important; border-color: #da3633; }

        .explanation-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 25px; display: none; flex-direction: column; gap: 15px; }
        .explanation-card.show { display: flex; }
        .explanation-header { font-size: 1.1em; font-weight: bold; color: var(--badge-green); border-bottom: 2px solid var(--badge-green); padding-bottom: 8px; }
        .lecture-slide-img { max-width: 100%; border-radius: 6px; border: 1px solid var(--border-color); margin-top: 10px; }
    </style>
</head>
<body data-theme="dark">

<sidebar>
    <div class="sidebar-header">
        <span>🌰 HEON archive</span>
    </div>
    <div class="menu-list">
        <div class="subject-item"><button class="subject-btn" onclick="selectSubject('혈액과 종양 1차')" id="default-sub">혈액과 종양 1차</button></div>
        <div class="subject-item"><button class="subject-btn" onclick="selectSubject('혈액과 종양 2차')">혈액과 종양 2차</button></div>
        <div class="subject-item"><button class="subject-btn" onclick="selectSubject('모성과 신생아')">모성과 신생아</button></div>
        <div class="subject-item"><button class="subject-btn" onclick="selectSubject('성장과 노화')">성장과 노화</button></div>
    </div>
</sidebar>

<div class="main-wrapper">
    <div class="topbar">
        <div class="topbar-title" id="topbar-title">혈액과 종양 1차 기출 퀴즈</div>
        <div class="topbar-controls">
            <button class="control-btn danger" id="reset-btn" style="display:none;" onclick="confirmReset()">기록 초기화</button>
            <button class="control-btn" id="back-btn" style="display:none;" onclick="goHome()">돌아가기</button>
            <button class="control-btn" onclick="toggleTheme()" id="theme-text">☀️ 라이트모드</button>
        </div>
    </div>

    <div class="content-area" id="content-area">
        <!-- 메인 대시보드 화면 -->
    </div>
</div>

<script>
    // 테마 전환
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('theme-text');
        if (body.getAttribute("data-theme") === "dark") {
            body.setAttribute("data-theme", "light");
            btn.innerText = "🌙 야탑런 모드";
        } else {
            body.setAttribute("data-theme", "dark");
            btn.innerText = "☀️ 라이트모드";
        }
    }

    let currentSubject = "혈액과 종양 1차";

    function selectSubject(name) {
        currentSubject = name;
        document.getElementById('topbar-title').innerText = name + " 기출 퀴즈";
        goHome();
    }

    function goHome() {
        document.getElementById('reset-btn').style.display = 'none';
        document.getElementById('back-btn').style.display = 'none';
        
        let examButtonsHtml = '';
        const exams = ['17(기말)', '18(기말)', '19(중간)', '20(기말)'];
        
        exams.forEach(exam => {
            const status = getExamStatus(currentSubject, exam); // 'completed', 'in-progress', 'not-started'
            let btnClass = 'not-started';
            let btnText = `○ ${exam}`;
            
            if (status === 'completed') {
                btnClass = 'completed';
                btnText = `✓ ${exam}`;
            } else if (status === 'in-progress') {
                btnClass = 'in-progress';
                btnText = `• ${exam} (진행중)`;
            }
            
            examButtonsHtml += `<button class="exam-btn ${btnClass}" onclick="startQuiz('${exam}')">${btnText}</button>`;
        });

        document.getElementById('content-area').innerHTML = `
            <div class="notice-banner">
                <span class="badge-update">최신 업데이트</span>
                <p>-코멘트- 교수님별 기출 아카이브 시스템입니다. 문제를 풀면 상태가 자동으로 저장됩니다!</p>
            </div>
            <div class="dashboard-section">
                <div class="section-title">박무림 교수님 파트</div>
                <div class="prof-dashboard-card">
                    <div class="prof-name">
                        <span>기출 시험 선택 (연도별 순차 풀이)</span>
                        <span style="font-size: 0.85em; color: #888;">총 5문제 수록</span>
                    </div>
                    <div class="exam-buttons-grid">
                        ${examButtonsHtml}
                    </div>
                </div>
            </div>
        `;
    }

    // 진도 상태 확인 함수 (LocalStorage 활용)
    function getExamStatus(sub, exam) {
        const progress = JSON.parse(localStorage.getItem(`progress_${sub}_${exam}`)) || {};
        const userAnswers = progress.answers || {};
        const answeredCount = Object.keys(userAnswers).length;
        
        if (answeredCount === 0) return 'not-started';
        if (answeredCount >= quizData.length) return 'completed';
        return 'in-progress';
    }

    function confirmReset() {
        if(confirm("현재까지 진행한 풀이 기록을 지우고 처음부터 다시 푸시겠습니까?")) {
            localStorage.removeItem(`progress_${currentSubject}_${currentExam}`);
            alert("기록이 초기화되었습니다.");
            startQuiz(currentExam);
        }
    }

    let currentExam = "";
    let currentQ = 0;

    // 박무림 교수님 야마 문제 데이터 (PDF 해설 완벽 반영)
    const quizData = [
        {
            question: "17-1. 대장암 다발성 간, 폐, 복강 림프절전이 환자의 항암치료 전후 변화이다. RECIST criteria에 의한 반응평가로 옳은 것은?<br><br>" +
                      "치료 전: 간병변 장경 3cm, 3cm, 2cm / 우측 폐병변 장경 2cm / 좌측 폐병변 장경 2cm / 복부 림프절 길이X폭 2X2 cm<br>" +
                      "치료 후: 간병변 장경 2cm, 2cm, 0cm / 우측 폐병변 장경 1cm / 좌측 폐병변 소실 / 복부 림프절 길이x폭 1.5X1cm",
            options: [
                "① 완전 관해 (Complete Response)",
                "② 부분 관해 (Partial Response)",
                "③ 안정병변 (Stable Disease)",
                "④ 진행 (Progressive Disease)",
                "⑤ 무반응"
            ],
            answer: 1,
            explanation: `
                <h3>정답: ② 부분 관해 (Partial Response)</h3>
                <p><strong>[근거 및 해설]</strong></p>
                <ul>
                    <li><strong>RECIST criteria 기준:</strong> 림프절을 제외한 다른 장기는 가장 장경이 긴 것을 2개까지 선택하여 총 5개까지의 합을 비교합니다.</li>
                    <li><strong>치료 전 합계:</strong> 간병변(3+3) + 우측 폐(2) + 좌측 폐(2) = 12cm</li>
                    <li><strong>치료 후 합계:</strong> 간병변(2+2) + 우측 폐(1) = 5cm (50% 이상 감소)</li>
                    <li>직경의 합이 30% 이상 감소하였으므로 <strong>부분 관해(PR)</strong>에 해당합니다.</li>
                </ul>
                <img src="https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=600" class="lecture-slide-img" alt="강의안 캡처">
            `
        },
        {
            question: "17-2. BRCA 돌연변이가 있는 암 세포에서 synthetic lethality 개념에 의해 암세포만을 선택적으로 죽일 수 있는 표적은?",
            options: [
                "① APC",
                "② MSH2",
                "③ HER2",
                "④ B-RAF",
                "⑤ PARP"
            ],
            answer: 4,
            explanation: `
                <h3>정답: ⑤ PARP</h3>
                <p><strong>[근거 및 해설]</strong></p>
                <p>Synthetic lethality 개념은 두 가지 유전자 중 어느 하나에 이상이 생기면 생존이 가능하지만, 두 가지 모두에 이상이 생기면 세포가 죽는다는 원리입니다.</p>
                <p>BRCA mutation이 있는 tumor cell에 대하여 <strong>PARP inhibitor</strong>를 사용할 경우 DNA 복구가 차단되어 암세포를 선택적으로 사멸시킬 수 있습니다.</p>
                <img src="https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=600" class="lecture-slide-img" alt="Synthetic Lethality">
            `
        },
        {
            question: "18-6. 38세 여자 환자가 유방암으로 진단되었다. 조직검사 및 유전자검사 소견: Invasive ductal carcinoma, ER(-), PR(-), HER2(-), BRCA1 생식선변이(+), BRCA2 생식선변이(-). 가장 효과를 기대할 수 있는 약제 및 기전은?",
            options: [
                "① Olaparib - synthetic lethality",
                "② Trastuzumab - anti HER2 monoclonal antibody",
                "③ Pertuzumab - anti HER2 monoclonal antibody",
                "④ Lapatinib - receptor tyrosine kinase inhibitor",
                "⑤ Everolimus - mTOR inhibitor"
            ],
            answer: 0,
            explanation: `
                <h3>정답: ① Olaparib - synthetic lethality</h3>
                <p><strong>[근거 및 해설]</strong></p>
                <p>환자는 삼중음성(Triple negative)이면서 <strong>BRCA1 양성</strong> 유방암 환자입니다. 이 경우 PARP 억제제인 <strong>Olaparib</strong>을 사용하여 synthetic lethality 기전으로 dsDNA breakage를 해결할 수 없는 BRCA mutation 암을 효과적으로 치료할 수 있습니다.</p>
            `
        },
        {
            question: "18-1. 다음 항암제의 특이 부작용으로 옳은 것은?",
            options: [
                "① Doxorubicin, Trastuzumab - 신부전, 심부전",
                "② Pembrolizumab, Nivolumab - immune-mediated toxicity",
                "③ Taxane, Vinca alkaloid - QTc 연장 및 신경독성",
                "④ Trastuzumab - 장천공, 출혈, 혈전증, 고혈압",
                "⑤ Cisplatin - 출혈성 방광염"
            ],
            answer: 1,
            explanation: `
                <h3>정답: ② Pembrolizumab, Nivolumab - immune-mediated toxicity</h3>
                <p><strong>[근거 및 해설]</strong></p>
                <ul>
                    <li><strong>Pembrolizumab, Nivolumab</strong> 등 면역관문억제제(IO)는 면역 매개성 장기 독성(Immune-mediated adverse events, irAE)을 유발합니다.</li>
                    <li>① Doxorubicin, Trastuzumab의 대표적 특이 부작용은 <strong>심부전(Cardiotoxicity, CHF)</strong>입니다.</li>
                    <li>③ Taxane의 부작용은 신경독성(Neurotoxicity)이며, Vinca alkaloid는 <strong>피부괴사(Vesicant)</strong>를 일으킵니다.</li>
                    <li>④ 장천공, 출혈, 혈전증, 고혈압은 Bevacizumab(VEGF 억제제)의 부작용입니다.</li>
                    <li>⑤ 출혈성 방광염은 Cyclophosphamide 및 Ifosfamide의 부작용입니다.</li>
                </ul>
            `
        },
        {
            question: "18-50. 8세 남자 환자가 의식이 명료하지 않고 기운이 없으며 소변을 거의 보지 못해 내원했다. 교정 칼슘(Corrected Ca)이 14.3 mg/dL로 측정되었을 때, 수액 공급 이외에 가장 중요한 응급 처치는?",
            options: [
                "① 혈액투석",
                "② 스테로이드",
                "③ calcitonin 주사",
                "④ 항암치료",
                "⑤ Zoledronic acid 주사"
            ],
            answer: 4,
            explanation: `
                <h3>정답: ⑤ Zoledronic acid 주사</h3>
                <p><strong>[근거 및 해설]</strong></p>
                <p>교정 칼슘 농도가 13.5 mg/dL를 초과하는 <strong>Severe hypercalcemia(중증 고칼슘혈증)</strong> 응급 상황입니다.</p>
                <p>가장 먼저 <strong>massive saline hydration(대량 생리식염수 수액 공급)</strong>과 forced diuresis(이뇨제)를 시행하며, 가장 효과적인 약물 치료로 비스포스포네이트 계열인 <strong>Zoledronate(또는 Pamidronate)</strong> 주사를 투여합니다.</p>
            `
        }
    ];

    function startQuiz(examName) {
        currentExam = examName;
        document.getElementById('reset-btn').style.display = 'block';
        document.getElementById('back-btn').style.display = 'block';
        document.getElementById('topbar-title').innerText = `${currentSubject} - (${examName}) 기출 풀이`;

        // 마지막으로 풀던 문제 번호 불러오기 (기본값 0)
        const progress = JSON.parse(localStorage.getItem(`progress_${currentSubject}_${currentExam}`)) || {};
        currentQ = progress.lastQuestion || 0;

        renderQuizScreen();
    }

    function renderQuizScreen() {
        const q = quizData[currentQ];
        const progress = JSON.parse(localStorage.getItem(`progress_${currentSubject}_${currentExam}`)) || { answers: {} };
        const userAnswers = progress.answers || {};

        // 정답/오답 개수 계산
        let correctCount = 0;
        let wrongCount = 0;
        Object.keys(userAnswers).forEach(qIdx => {
            if (userAnswers[qIdx] === quizData[qIdx].answer) correctCount++;
            else wrongCount++;
        });

        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
            let btnClass = 'option-btn';
            if (userAnswers[currentQ] !== undefined) {
                if (idx === q.answer) btnClass += ' correct';
                else if (idx === userAnswers[currentQ]) btnClass += ' wrong';
            }
            optionsHtml += `<button class="${btnClass}" onclick="checkAnswer(${idx})">${opt}</button>`;
        });

        // 드롭다운 문제 선택 옵션 생성
        let selectOptions = '';
        quizData.forEach((item, idx) => {
            let mark = "";
            if (userAnswers[idx] !== undefined) {
                mark = userAnswers[idx] === item.answer ? " (정답)" : " (오답)";
            }
            selectOptions += `<option value="${idx}" ${idx === currentQ ? 'selected' : ''}>Q${idx + 1} (${item.question.substring(0, 6)}...)${mark}</option>`;
        });

        document.getElementById('content-area').innerHTML = `
            <div class="quiz-container">
                <div class="quiz-left">
                    <div class="quiz-toolbar">
                        <div>
                            <label>문제 이동: </label>
                            <select class="q-select" onchange="changeQuestion(this.value)">
                                ${selectOptions}
                            </select>
                        </div>
                        <div class="score-board">
                            맞은 개수: <span style="color:var(--badge-green);">${correctCount}</span>개 | 틀린 개수: <span style="color:#da3633;">${wrongCount}</span>개
                        </div>
                    </div>
                    <div class="question-box">${q.question}</div>
                    <div class="options-list" id="options-box">
                        ${optionsHtml}
                    </div>
                </div>
                <div class="quiz-right">
                    <div id="explanation-container" class="explanation-card ${userAnswers[currentQ] !== undefined ? 'show' : ''}">
                        <div class="explanation-header">정답 및 해설</div>
                        <div id="exp-body">${q.explanation}</div>
                    </div>
                </div>
            </div>
        `;
    }

    function changeQuestion(val) {
        currentQ = parseInt(val);
        saveProgress(currentQ, null);
        renderQuizScreen();
    }

    function checkAnswer(selectedIdx) {
        const q = quizData[currentQ];
        const buttons = document.getElementById('options-box').getElementsByTagName('button');

        for(let i=0; i<buttons.length; i++) {
            buttons[i].classList.remove('correct', 'wrong');
        }

        if(selectedIdx === q.answer) {
            buttons[selectedIdx].classList.add('correct');
        } else {
            buttons[selectedIdx].classList.add('wrong');
            buttons[q.answer].classList.add('correct');
        }

        // 진도 및 답변 저장
        saveProgress(currentQ, selectedIdx);

        // 우측 해설 창 열기
        document.getElementById('explanation-container').classList.add('show');
        
        // 상단 스코어 실시간 갱신을 위해 화면 다시 렌더링
        setTimeout(() => renderQuizScreen(), 300);
    }

    function saveProgress(qIdx, ans) {
        const key = `progress_${currentSubject}_${currentExam}`;
        let progress = JSON.parse(localStorage.getItem(key)) || { answers: {}, lastQuestion: 0 };
        progress.lastQuestion = qIdx;
        if (ans !== null) {
            progress.answers[qIdx] = ans;
        }
        localStorage.setItem(key, JSON.stringify(progress));
    }
</script>

</body>
</html>
