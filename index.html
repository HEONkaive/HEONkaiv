<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>문제풀이 웹사이트</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f9f9f9; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .question { font-size: 1.2em; font-weight: bold; margin-bottom: 20px; }
        .options button { display: block; width: 100%; padding: 12px; margin: 10px 0; font-size: 1em; cursor: pointer; border: 1px solid #ddd; border-radius: 5px; background: #fff; text-align: left; }
        .options button:hover { background: #f0f0f0; }
        #result { margin-top: 20px; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="card">
    <div id="quiz-container">
        <div id="question-text" class="question">문로딩 중...</div>
        <div id="options-container" class="options"></div>
    </div>
    <div id="result"></div>
</div>

<script>
    // PDF 내용을 바탕으로 구성한 문제 데이터 예시
    const quizData = [
        {
            question: "1. 다음 중 웹 프론트엔드 언어가 아닌 것은?",
            options: ["HTML", "CSS", "Python", "JavaScript"],
            answer: 2 // 0부터 시작하므로 Python(3번째)은 2
        },
        {
            question: "2. 웹페이지의 뼈대를 담당하는 언어는?",
            options: ["HTML", "CSS", "SQL", "Java"],
            answer: 0
        }
    ];

    let currentQuestion = 0;
    let score = 0;

    function loadQuiz() {
        const q = quizData[currentQuestion];
        document.getElementById("question-text").innerText = q.question;
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(index);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(selected) {
        const q = quizData[currentQuestion];
        if (selected === q.answer) {
            score++;
            alert("정답입니다!");
        } else {
            alert("오답입니다!");
        }

        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuiz();
        } else {
            document.getElementById("quiz-container").innerHTML = `<h2>퀴즈 완료!</h2><p>총 ${quizData.length}문제 중 ${score}문제를 맞추셨습니다.</p>`;
        }
    }

    loadQuiz();
</script>

</body>
</html>
